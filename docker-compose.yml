version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ngo_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ngo_user:ngo_secure_pass@postgres:5432/ngo_commons
      - JWT_SECRET=ngo_super_secret_jwt_key_2026_production_grade
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    depends_on:
      - postgres
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ngo_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    container_name: ngo_postgres
    restart: always
    environment:
      POSTGRES_USER: ngo_user
      POSTGRES_PASSWORD: ngo_secure_pass
      POSTGRES_DB: ngo_commons
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
